<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Night Audit probe</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #cfc8b8; overflow: hidden;
    font: 12px/1.35 ui-monospace, Menlo, monospace; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #vf { position: absolute; display: block; background: #222; }
  #info { position: absolute; left: 6px; top: calc(env(safe-area-inset-top) + 4px); white-space: pre;
    pointer-events: none; z-index: 3; text-shadow: 0 0 3px #000, 0 0 3px #000; }
  .dot { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%;
    border: 2px solid #ffb347; pointer-events: none; z-index: 4; }
  #crease { position: absolute; background: rgba(255, 60, 60, .5); pointer-events: none; z-index: 2; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js" } }</script>
</head>
<body>
<canvas id="vf"></canvas>
<div id="crease"></div>
<div id="info">loading…</div>
<script type="module">
import * as THREE from 'three';

const LOG = ['localhost', '127.0.0.1'].includes(location.hostname) || location.search.includes('devlog');
function log(kind, data) {
  console.log(kind, data);
  if (LOG) fetch('/__log', { method: 'POST', keepalive: true, body: JSON.stringify({ kind, data, t: Math.round(performance.now()) }) }).catch(() => {});
}
addEventListener('error', (e) => log('page-error', `${e.message} ${e.filename}:${e.lineno}`));
addEventListener('unhandledrejection', (e) => log('page-rejection', String(e.reason)));

const qH = matchMedia('(horizontal-viewport-segments: 2)');
const qV = matchMedia('(vertical-viewport-segments: 2)');
const qFold = matchMedia('(device-posture: folded)');

const canvas = document.getElementById('vf');
const info = document.getElementById('info');
const crease = document.getElementById('crease');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
const gl = renderer.getContext();
const dbg = gl.getExtension('WEBGL_debug_renderer_info');
const RT_W = 480, RT_H = 360;
const rt = new THREE.WebGLRenderTarget(RT_W, RT_H, { type: THREE.HalfFloatType, depthBuffer: true });
rt.texture.minFilter = rt.texture.magFilter = THREE.LinearFilter;

// Test scene: a mid-grey room, one warm point light, one camera lamp.
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(62, 4 / 3, 0.05, 60);
cam.position.set(0, 1.6, 2.5);
const room = new THREE.Mesh(new THREE.BoxGeometry(6, 2.6, 8), new THREE.MeshLambertMaterial({ color: 0x808080, side: THREE.BackSide }));
room.position.y = 1.3;
scene.add(room);
const box = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), new THREE.MeshLambertMaterial({ color: 0x9a6b3f }));
box.position.set(0.6, 0.4, -1.5);
scene.add(box);
const bulb = new THREE.PointLight(0xffb36b, 6, 0, 2);
bulb.position.set(-1.8, 2.2, -2.5);
scene.add(bulb);
const lamp = new THREE.SpotLight(0xfff1d6, 18, 14, 0.42, 0.55, 2);
lamp.castShadow = true;
lamp.shadow.mapSize.set(512, 512);
box.castShadow = true; box.receiveShadow = true; room.receiveShadow = true;
renderer.shadowMap.enabled = true;
cam.add(lamp); lamp.position.set(0.15, -0.1, 0); lamp.target.position.set(0, 0, -1); cam.add(lamp.target);
scene.add(cam);
scene.add(new THREE.AmbientLight(0x404050, 0.25));

// Post pass: linear -> sRGB, grain, chroma offset, vignette.
const post = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms: { tSrc: { value: rt.texture }, uTime: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }',
  fragmentShader: `
    precision highp float; varying vec2 vUv; uniform sampler2D tSrc; uniform float uTime;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233)) + uTime * 37.0) * 43758.5453); }
    vec3 toSRGB(vec3 c){ c = max(c, 0.0); return mix(c * 12.92, 1.055 * pow(c, vec3(1.0/2.4)) - 0.055, step(0.0031308, c)); }
    void main(){
      vec2 uv = vUv; float off = 0.0025 * (0.4 + length(uv - 0.5));
      vec3 c = vec3(texture2D(tSrc, uv + vec2(off, 0.)).r, texture2D(tSrc, uv).g, texture2D(tSrc, uv - vec2(off, 0.)).b);
      c = toSRGB(c);
      c += (h(floor(uv * vec2(480., 360.))) - 0.5) * 0.08;
      c *= 1.0 - 0.6 * pow(length((uv - 0.5) * vec2(1.1, 1.0)), 2.2);
      gl_FragColor = vec4(c, 1.0);
    }`,
  depthTest: false, depthWrite: false,
}));
const postScene = new THREE.Scene(); postScene.add(post);
const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

let mode = '?', rect = { x: 0, y: 0, w: 0, h: 0 }, foldX = null, foldY = null;
function layout() {
  const W = innerWidth, H = innerHeight;
  const segs = window.viewport?.segments ?? null;
  const folded = qFold.matches || navigator.devicePosture?.type === 'folded';
  foldX = foldY = null;
  if (qH.matches) { mode = 'book'; foldX = segs?.length === 2 ? segs[0].x + segs[0].width : W / 2; }
  else if (qV.matches) { mode = 'deck'; foldY = segs?.length === 2 ? segs[0].y + segs[0].height : H / 2; }
  else if (W / H >= 1.15) mode = 'theater';
  else mode = 'handheld';
  let box;
  if (mode === 'book') box = { x: 0, y: 0, w: foldX - 12, h: H };
  else if (mode === 'deck') box = { x: 0, y: 0, w: W, h: foldY - 12 };
  else if (mode === 'handheld') box = { x: 0, y: 0, w: W, h: H * 0.62 };
  else box = { x: 0, y: 0, w: W, h: H };
  let w = box.w, h = w * 3 / 4;
  if (h > box.h) { h = box.h; w = h * 4 / 3; }
  rect = { x: Math.round(box.x + (box.w - w) / 2), y: Math.round(box.y + (box.h - h) / 2), w: Math.round(w), h: Math.round(h) };
  Object.assign(canvas.style, { left: rect.x + 'px', top: rect.y + 'px', width: rect.w + 'px', height: rect.h + 'px' });
  const dpr = Math.min(devicePixelRatio || 1, 2);
  renderer.setSize(Math.round(rect.w * dpr), Math.round(rect.h * dpr), false);
  if (foldX != null) Object.assign(crease.style, { left: foldX - 1 + 'px', top: 0, width: '2px', height: '100%', display: 'block' });
  else if (foldY != null) Object.assign(crease.style, { left: 0, top: foldY - 1 + 'px', width: '100%', height: '2px', display: 'block' });
  else crease.style.display = 'none';
  log('layout', { mode, W, H, vv: [visualViewport?.width, visualViewport?.height], dpr: devicePixelRatio, rect, foldX, foldY, folded,
    posture: navigator.devicePosture?.type ?? null, segs: segs?.map(s => [s.x, s.y, s.width, s.height]) ?? null,
    screen: [screen.width, screen.height], orient: screen.orientation?.type });
}
let timers = [];
function schedule() { timers.forEach(clearTimeout); timers = [0, 250, 600, 1100, 1800].map(ms => setTimeout(layout, ms)); }
addEventListener('resize', schedule);
for (const q of [qH, qV, qFold]) q.addEventListener('change', schedule);
navigator.devicePosture?.addEventListener('change', schedule);
window.viewport?.addEventListener?.('segmentschange', schedule);

// Pointer logger.
const pointers = new Map();
const dots = new Map();
let lastLog = 0, moves = 0;
function dot(id) { let d = dots.get(id); if (!d) { d = document.createElement('div'); d.className = 'dot'; document.body.appendChild(d); dots.set(id, d); } return d; }
function onPtr(e) {
  e.preventDefault();
  if (e.type === 'pointerdown') { pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, type: e.pointerType }); log('ptr-down', { id: e.pointerId, x: Math.round(e.clientX), y: Math.round(e.clientY), type: e.pointerType, active: pointers.size }); }
  if (e.type === 'pointermove' && pointers.has(e.pointerId)) { pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, type: e.pointerType }); moves++; }
  if (e.type === 'pointerup' || e.type === 'pointercancel') { pointers.delete(e.pointerId); dots.get(e.pointerId)?.remove(); dots.delete(e.pointerId); log('ptr-' + e.type.slice(7), { id: e.pointerId, active: pointers.size, moves }); }
  for (const [id, p] of pointers) { const d = dot(id); d.style.left = p.x + 'px'; d.style.top = p.y + 'px'; }
}
for (const t of ['pointerdown', 'pointermove', 'pointerup', 'pointercancel']) addEventListener(t, onPtr, { passive: false });
for (const t of ['touchstart', 'touchmove', 'gesturestart', 'dblclick']) addEventListener(t, (e) => e.preventDefault(), { passive: false });

let frames = 0, fps = 0, fpsT = performance.now();
function frame(t) {
  requestAnimationFrame(frame);
  cam.rotation.y = Math.sin(t / 2400) * 0.5;
  post.material.uniforms.uTime.value = (t / 1000) % 100;
  renderer.setRenderTarget(rt); renderer.render(scene, cam);
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
  frames++;
  if (t - fpsT > 1000) { fps = Math.round(frames * 1000 / (t - fpsT)); frames = 0; fpsT = t; }
  info.textContent = `three r${THREE.REVISION}  fps ${fps}\nmode ${mode}  vp ${innerWidth}x${innerHeight}  dpr ${devicePixelRatio}\nrect ${rect.w}x${rect.h}@${rect.x},${rect.y}  fold ${foldX ?? foldY ?? '-'}\nposture ${navigator.devicePosture?.type ?? 'n/a'}  segs ${window.viewport?.segments?.length ?? 'n/a'}\npointers ${pointers.size}`;
  if (t - lastLog > 5000) { lastLog = t; log('fps', { fps, mode }); }
}

log('boot', { ua: navigator.userAgent, three: THREE.REVISION, secure: isSecureContext,
  gpu: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER), webgl2: renderer.capabilities.isWebGL2,
  maxTex: gl.getParameter(gl.MAX_TEXTURE_SIZE), halfFloatRT: !!gl.getExtension('EXT_color_buffer_half_float') || renderer.capabilities.isWebGL2,
  audioSession: 'audioSession' in navigator ? navigator.audioSession.type : null, devicePosture: !!navigator.devicePosture,
  viewportSegments: 'viewport' in window, fullscreen: !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen),
  standalone: matchMedia('(display-mode: standalone)').matches });
layout();
requestAnimationFrame(frame);
</script>
</body>
</html>
